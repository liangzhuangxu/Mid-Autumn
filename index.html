<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>花好月圆 · 中秋祝福</title>
<style>
  *,*::before,*::after{box-sizing:border-box}

  :root{
    --gold:#e8c96a;
    --gold-deep:#c9a227;
    --gold-light:#f7e3a8;
    --cream:#f6efe2;
    --red:#e8503a;
  }

  html,body{height:100%}

  body{
    margin:0;
    min-height:100%;
    font-family:"Songti SC","STSong","SimSun","Noto Serif SC",Georgia,serif;
    color:var(--cream);
    background:radial-gradient(125% 85% at 50% 0%,
      #20304f 0%, #16203a 36%, #0a1020 68%, #05070f 100%);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  :focus-visible{
    outline:2px solid var(--gold);
    outline-offset:3px;
    border-radius:6px;
  }

  /* ============ 一、夜空背景层 ============ */
  .sky{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:0;
    pointer-events:none;
  }

  /* --- 星空 + 烟花（统一 Canvas，替代 DOM 星星，性能更优） --- */
  #fireworks{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    display:block;
  }

  /* --- 月亮 --- */
  .moon{
    position:absolute;
    top:clamp(20px,4.5vh,64px);
    left:50%;
    transform:translateX(-50%);
    width:min(40vmin,300px);
    aspect-ratio:1;
    border-radius:50%;
    z-index:2;
    animation:moonGlow 7s ease-in-out infinite;
  }
  .moon__disc{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 34% 30%,
      #fffdf6 0%, #fff4d2 32%, #f8e2a4 62%, #e9c877 88%, #dcb95f 100%);
    box-shadow:
      inset -16px -12px 36px rgba(178,138,58,.35),
      inset  12px  10px 28px rgba(255,255,245,.55);
  }
  /* 环形山 / 月海 */
  .moon__disc::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:
      radial-gradient(circle at 66% 28%, rgba(198,166,98,.30) 0 9%,  transparent 10%),
      radial-gradient(circle at 38% 60%, rgba(198,166,98,.24) 0 12%, transparent 13%),
      radial-gradient(circle at 74% 66%, rgba(198,166,98,.20) 0 7%,  transparent 8%),
      radial-gradient(circle at 26% 32%, rgba(198,166,98,.16) 0 5%,  transparent 6%);
    filter:blur(3px);
  }
  @keyframes moonGlow{
    0%,100%{
      box-shadow:
        0 0 60px 16px rgba(255,236,180,.28),
        0 0 150px 60px rgba(255,220,140,.13),
        0 0 300px 140px rgba(255,200,110,.06);
    }
    50%{
      box-shadow:
        0 0 80px 24px rgba(255,236,180,.40),
        0 0 190px 80px rgba(255,220,140,.19),
        0 0 360px 170px rgba(255,200,110,.09);
    }
  }

  /* --- 流云 --- */
  .cloud{
    position:absolute;
    left:0;
    height:13vmin;
    border-radius:50%;
    filter:blur(28px);
    background:radial-gradient(ellipse at center,
      rgba(190,210,255,.22), rgba(140,170,230,.08) 55%, transparent 72%);
    animation:drift linear infinite;
  }
  .cloud--1{ width:48vmin; top:15vh; animation-duration:78s;  animation-delay:-12s }
  .cloud--2{ width:34vmin; top:26vh; animation-duration:104s; animation-delay:-46s; opacity:.8 }
  .cloud--3{ width:58vmin; top:6vh;  animation-duration:132s; animation-delay:-84s; opacity:.55 }
  @keyframes drift{
    from{ transform:translateX(-62vw) }
    to  { transform:translateX(120vw) }
  }

  /* --- 远山剪影 --- */
  .hills{
    position:absolute;
    left:0; right:0; bottom:0;
    width:100%;
    height:clamp(110px,22vh,220px);
    display:block;
  }

  /* ============ 二、灯笼 ============ */
  .lantern{
    position:fixed;
    top:-14px;
    width:clamp(46px,6.5vw,72px);
    z-index:1;
    transform-origin:50% 0;
    animation:swing 5.5s ease-in-out infinite;
    pointer-events:none;
    filter:drop-shadow(0 12px 32px rgba(255,90,60,.35));
  }
  .lantern--left { left:clamp(10px,4vw,64px) }
  .lantern--right{ right:clamp(10px,4vw,64px); animation-delay:-2.75s }

  @keyframes swing{
    0%,100%{ transform:rotate(-4.5deg) }
    50%    { transform:rotate(4.5deg)  }
  }

  .lantern__rope{
    display:block;
    width:1px;
    height:clamp(58px,10vh,110px);
    margin:0 auto;
    background:linear-gradient(180deg,
      rgba(232,201,106,.05), rgba(232,201,106,.8));
  }

  .lantern__body{
    position:relative;
    width:100%;
    aspect-ratio:1 / 1.12;
    border-radius:50% / 42%;
    background:radial-gradient(circle at 32% 28%,
      #ff9d7a 0%, #e8503a 38%, #b5261a 72%, #7d160e 100%);
    box-shadow:
      inset -7px 0 16px rgba(0,0,0,.38),
      inset  7px 0 16px rgba(255,205,165,.20),
      0 0 26px rgba(255,95,60,.45);
  }
  /* 灯笼竖纹 */
  .lantern__body::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    background:repeating-linear-gradient(90deg,
      rgba(255,228,185,.28) 0 1px, transparent 1px 8px);
    mix-blend-mode:screen;
    opacity:.6;
  }

  /* 上下金盖 */
  .lantern__cap{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    width:46%;
    height:8%;
    border-radius:3px;
    background:linear-gradient(180deg,#f4d172,#b8891f);
    box-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  .lantern__cap--top   { top:-3.5% }
  .lantern__cap--bottom{ bottom:-3.5% }

  /* 流苏 */
  .lantern__tassel{
    position:absolute;
    left:50%;
    top:100%;
    transform:translateX(-50%);
    width:2px;
    height:clamp(22px,3.6vh,40px);
    border-radius:2px;
    background:linear-gradient(180deg,#f0c860,#b5261a);
  }
  .lantern__tassel::before{
    content:"";
    position:absolute;
    top:-7px;
    left:50%;
    transform:translateX(-50%);
    width:10px;
    height:10px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffe4a0,#c9a227);
  }

  /* ============ 三、内容层 ============ */
  .stage{
    position:relative;
    z-index:2;
    min-height:100vh;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    gap:clamp(10px,1.6vh,18px);
    padding:clamp(200px,34vh,320px) 22px calc(clamp(28px,5vh,56px) + env(safe-area-inset-bottom));
    text-align:center;
  }

  /* 逐级入场 */
  @keyframes rise{
    from{ opacity:0; transform:translateY(26px) }
    to  { opacity:1; transform:translateY(0)     }
  }
  .stage > *{
    animation:rise .9s cubic-bezier(.22,.8,.3,1) both;
  }
  .stage > *:nth-child(1){ animation-delay:.10s }
  .stage > *:nth-child(2){ animation-delay:.22s }
  .stage > *:nth-child(3){ animation-delay:.34s }
  .stage > *:nth-child(4){ animation-delay:.44s }
  .stage > *:nth-child(5){ animation-delay:.56s }
  .stage > *:nth-child(6){ animation-delay:.70s }

  /* 眉标 */
  .eyebrow{
    margin:0;
    font-size:clamp(11px,2.6vw,13px);
    letter-spacing:.5em;
    text-indent:.5em;
    color:rgba(232,201,106,.78);
  }

  /* 主标题 */
  .title{
    margin:0;
    font-size:clamp(42px,11vw,80px);
    font-weight:400;
    line-height:1.14;
    letter-spacing:.3em;
    text-indent:.3em;
    background:linear-gradient(180deg,
      #fffaf0 0%, #f7e3a8 38%, #dcb75a 72%, #b98c22 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 6px 22px rgba(232,201,106,.28));
  }

  /* 分隔线 */
  .divider{
    position:relative;
    width:min(180px,42vw);
    height:1px;
    margin:2px 0;
    background:linear-gradient(90deg,transparent,rgba(232,201,106,.85),transparent);
  }
  .divider::after{
    content:"";
    position:absolute;
    top:50%;
    left:50%;
    width:6px;
    height:6px;
    transform:translate(-50%,-50%) rotate(45deg);
    background:var(--gold);
    box-shadow:0 0 10px rgba(232,201,106,.9);
  }

  .subtitle{
    margin:0;
    font-family:Georgia,"Times New Roman",serif;
    font-size:clamp(10px,2.4vw,12px);
    letter-spacing:.42em;
    text-indent:.42em;
    text-transform:uppercase;
    color:rgba(246,239,226,.42);
  }

  /* ---------- 祝福卡片 ---------- */
  .card{
    position:relative;
    width:min(580px,100%);
    margin-top:clamp(8px,2vh,20px);
    padding:clamp(30px,4.5vw,46px) clamp(26px,5vw,54px) clamp(40px,5.4vw,54px);
    border-radius:22px;
    background:linear-gradient(155deg,
      rgba(255,255,255,.10) 0%,
      rgba(255,255,255,.035) 42%,
      rgba(232,201,106,.07) 100%);
    border:1px solid rgba(232,201,106,.32);
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    box-shadow:
      0 30px 70px -28px rgba(0,0,0,.85),
      0 1px 0 rgba(255,255,255,.16) inset;
  }
  /* 四角描金 */
  .card::before{
    content:"";
    position:absolute;
    inset:11px;
    border-radius:14px;
    pointer-events:none;
    opacity:.55;
    background:
      linear-gradient(var(--gold),var(--gold)) left  top    / 18px 1px no-repeat,
      linear-gradient(var(--gold),var(--gold)) left  top    / 1px 18px no-repeat,
      linear-gradient(var(--gold),var(--gold)) right top    / 18px 1px no-repeat,
      linear-gradient(var(--gold),var(--gold)) right top    / 1px 18px no-repeat,
      linear-gradient(var(--gold),var(--gold)) left  bottom / 18px 1px no-repeat,
      linear-gradient(var(--gold),var(--gold)) left  bottom / 1px 18px no-repeat,
      linear-gradient(var(--gold),var(--gold)) right bottom / 18px 1px no-repeat,
      linear-gradient(var(--gold),var(--gold)) right bottom / 1px 18px no-repeat;
  }

  .verse{
    margin:0 0 clamp(16px,2.6vh,26px);
    font-size:clamp(15px,3.6vw,19px);
    letter-spacing:.2em;
    text-indent:.2em;
    color:rgba(246,239,226,.94);
  }
  .verse::before,
  .verse::after{
    content:"❖";
    font-size:.7em;
    color:rgba(232,201,106,.75);
    vertical-align:.12em;
    margin:0 .7em;
  }

  .wish{
    margin:0;
    font-size:clamp(14px,3.4vw,17px);
    line-height:2.1;
    letter-spacing:.14em;
    color:rgba(246,239,226,.78);
  }

  /* 印章 */
  .seal{
    position:absolute;
    right:clamp(16px,3.5vw,30px);
    bottom:clamp(14px,3vw,26px);
    width:44px;
    height:44px;
    display:grid;
    place-items:center;
    writing-mode:vertical-rl;
    font-size:13px;
    letter-spacing:.12em;
    line-height:1;
    color:#f0634f;
    border:1.5px solid #e05a4a;
    border-radius:7px;
    opacity:.85;
    transform:rotate(-2deg);
    box-shadow:0 0 14px rgba(224,90,74,.28);
    user-select:none;
  }

  .foot{
    margin:clamp(6px,1.5vh,14px) 0 0;
    font-size:clamp(11px,2.6vw,13px);
    letter-spacing:.3em;
    text-indent:.3em;
    color:rgba(246,239,226,.34);
  }

  /* ============ 四、烟花交互控件 ============ */
  .fire-toggle{
    position:fixed;
    right:max(14px,env(safe-area-inset-right));
    bottom:max(16px,env(safe-area-inset-bottom));
    z-index:6;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 16px;
    font-family:inherit;
    font-size:13px;
    letter-spacing:.18em;
    text-indent:.18em;
    color:var(--gold-light);
    background:rgba(20,30,56,.55);
    border:1px solid rgba(232,201,106,.42);
    border-radius:999px;
    cursor:pointer;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    transition:background .25s ease, color .25s ease, box-shadow .25s ease;
    user-select:none;
  }
  .fire-toggle:hover{
    background:rgba(38,52,92,.72);
    box-shadow:0 0 22px rgba(232,201,106,.35);
  }
  .fire-toggle[aria-pressed="false"]{
    color:rgba(246,239,226,.55);
  }
  .fire-toggle__dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 8px rgba(232,201,106,.9);
  }
  .fire-toggle[aria-pressed="false"] .fire-toggle__dot{
    background:rgba(246,239,226,.45);
    box-shadow:none;
  }

  /* 点击提示 */
  .fire-hint{
    position:fixed;
    left:50%;
    bottom:max(14px,env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:6;
    margin:0;
    padding:8px 18px;
    font-size:12px;
    letter-spacing:.28em;
    text-indent:.28em;
    color:rgba(246,239,226,.55);
    background:rgba(10,16,32,.35);
    border-radius:999px;
    pointer-events:none;
    opacity:0;
    transition:opacity 1.2s ease;
    animation:hintIn 1s ease .9s forwards;
  }
  @keyframes hintIn{
    to{ opacity:1 }
  }
  .fire-hint.is-faded{ opacity:0 }

  /* ============ 开场：输入收信人姓名 ============ */
  .intro{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
    background:radial-gradient(125% 85% at 50% 0%,
      rgba(32,48,79,.84) 0%, rgba(16,26,46,.9) 45%, rgba(5,7,15,.96) 100%);
    transition:opacity .7s ease, visibility .7s;
  }
  .intro.is-done{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .intro__card{
    position:relative;
    width:min(520px,100%);
    padding:clamp(34px,6vw,58px) clamp(26px,6vw,54px);
    border-radius:22px;
    text-align:center;
    background:linear-gradient(155deg,
      rgba(255,255,255,.10) 0%,
      rgba(255,255,255,.035) 42%,
      rgba(232,201,106,.07) 100%);
    border:1px solid rgba(232,201,106,.32);
    box-shadow:0 30px 70px -28px rgba(0,0,0,.85);
    animation:introPop .6s cubic-bezier(.22,.8,.3,1) both;
  }
  @keyframes introPop{
    from{ opacity:0; transform:translateY(18px) scale(.97) }
    to  { opacity:1; transform:translateY(0)    scale(1)   }
  }
  .intro__eyebrow{
    margin:0 0 10px;
    font-size:clamp(11px,2.6vw,13px);
    letter-spacing:.5em;
    text-indent:.5em;
    color:rgba(232,201,106,.8);
  }
  .intro__title{
    margin:0 0 clamp(14px,3vh,22px);
    font-size:clamp(34px,9vw,52px);
    font-weight:400;
    line-height:1.15;
    letter-spacing:.3em;
    text-indent:.3em;
    background:linear-gradient(180deg,#fffaf0 0%,#f7e3a8 38%,#dcb75a 72%,#b98c22 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 6px 22px rgba(232,201,106,.28));
  }
  .intro__field{
    margin:0 0 clamp(18px,3vh,26px);
    font-size:clamp(12px,2.6vw,14px);
    letter-spacing:.28em;
    text-indent:.28em;
    color:rgba(246,239,226,.6);
  }
  .intro__input{
    display:block;
    width:min(300px,82%);
    margin:0 auto clamp(8px,1.6vh,14px);
    padding:10px 6px;
    font-family:inherit;
    font-size:clamp(18px,4.6vw,24px);
    letter-spacing:.2em;
    text-align:center;
    color:var(--cream);
    background:transparent;
    border:none;
    border-bottom:1.5px solid rgba(232,201,106,.55);
    border-radius:0;
    outline:none;
    caret-color:var(--gold);
  }
  .intro__input:focus{
    border-bottom-color:var(--gold);
    box-shadow:0 1px 0 var(--gold);
  }
  .intro__input:focus-visible{ outline:none }
  .intro__input::placeholder{
    color:rgba(246,239,226,.3);
    letter-spacing:.08em;
  }
  .intro__err{
    min-height:18px;
    margin:0 0 14px;
    font-size:12px;
    letter-spacing:.15em;
    color:#ffb38a;
    opacity:0;
    transition:opacity .3s ease;
  }
  .intro.is-error .intro__err{ opacity:1 }
  .intro.is-error .intro__card{ animation:shake .4s ease }
  @keyframes shake{
    20%{ transform:translateX(-8px) }
    40%{ transform:translateX(8px)  }
    60%{ transform:translateX(-5px) }
    80%{ transform:translateX(5px)  }
  }
  .intro__cta{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:12px 30px;
    font-family:inherit;
    font-size:15px;
    letter-spacing:.3em;
    text-indent:.3em;
    color:var(--gold-light);
    background:rgba(232,201,106,.08);
    border:1px solid rgba(232,201,106,.55);
    border-radius:999px;
    cursor:pointer;
    transition:background .25s ease, box-shadow .25s ease;
  }
  .intro__cta:hover{
    background:rgba(232,201,106,.18);
    box-shadow:0 0 24px rgba(232,201,106,.35);
  }

  /* ============ 五、响应式与无障碍 ============ */
  @media (max-width:640px){
    .lantern{ width:42px; opacity:.85 }
    .lantern--left { left:6px }
    .lantern--right{ right:6px }
    .seal{ width:38px; height:38px; font-size:11px }
    .fire-toggle{ padding:9px 13px; font-size:12px }
  }

  @media (prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
    .fire-toggle__dot{ animation:none }
  }
</style>
</head>
<body>

  <!-- ========== 开场：输入收信人姓名 ========== -->
  <div class="intro" id="intro" role="dialog" aria-modal="true" aria-labelledby="introTitle">
    <div class="intro__card">
      <p class="intro__eyebrow">中秋 · 月光祝福</p>
      <h2 class="intro__title" id="introTitle">花好月圆</h2>
      <p class="intro__field">月光已至，请留下收信人的名字</p>
      <input class="intro__input" id="introName" type="text"
             maxlength="12" autocomplete="off" aria-label="收信人姓名"
             placeholder="输入姓名" />
      <p class="intro__err" id="introErr" role="alert">请先输入收信人的名字</p>
      <button class="intro__cta" id="introCta" type="button">送出祝福</button>
    </div>
  </div>

  <!-- ========== 夜空层（星空 + 烟花由 Canvas 统一绘制） ========== -->
  <div class="sky" aria-hidden="true">
    <canvas id="fireworks"></canvas>

    <div class="moon">
      <div class="moon__disc"></div>
    </div>

    <span class="cloud cloud--1"></span>
    <span class="cloud cloud--2"></span>
    <span class="cloud cloud--3"></span>

    <svg class="hills" viewBox="0 0 1440 220" preserveAspectRatio="none">
      <defs>
        <linearGradient id="hillGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#0b1428" stop-opacity=".92"/>
          <stop offset="100%" stop-color="#05070f" stop-opacity="1"/>
        </linearGradient>
      </defs>
      <path fill="url(#hillGrad)"
        d="M0,220 L0,140
           C90,110 160,152 250,120
           C340,90 400,132 500,110
           C600,90 660,142 760,120
           C860,100 920,146 1020,115
           C1120,85 1180,132 1280,110
           C1360,94 1400,126 1440,115
           L1440,220 Z"/>
    </svg>
  </div>

  <!-- ========== 灯笼 ========== -->
  <div class="lantern lantern--left" aria-hidden="true">
    <span class="lantern__rope"></span>
    <div class="lantern__body">
      <span class="lantern__cap lantern__cap--top"></span>
      <span class="lantern__cap lantern__cap--bottom"></span>
    </div>
    <span class="lantern__tassel"></span>
  </div>

  <div class="lantern lantern--right" aria-hidden="true">
    <span class="lantern__rope"></span>
    <div class="lantern__body">
      <span class="lantern__cap lantern__cap--top"></span>
      <span class="lantern__cap lantern__cap--bottom"></span>
    </div>
    <span class="lantern__tassel"></span>
  </div>

  <!-- ========== 内容层 ========== -->
  <main class="stage">
    <p class="eyebrow">农历八月十五 · 中秋</p>

    <h1 class="title">花好月圆</h1>

    <div class="divider" aria-hidden="true"></div>

    <p class="subtitle">Mid-Autumn Festival</p>

    <section class="card">
      <p class="verse">海上生明月 · 天涯共此时</p>
      <p class="wish">
        愿清辉所至，皆是团圆<br />
        愿心之所念，皆得圆满
      </p>
      <span class="seal" aria-hidden="true">中秋</span>
    </section>

    <p class="foot">桂子飘香 · 人间至味是团圆</p>
  </main>

  <!-- ========== 烟花交互控件 ========== -->
  <button class="fire-toggle" id="fireToggle" type="button" aria-pressed="false" aria-label="收到祝福，绽放烟花">
    <span class="fire-toggle__dot" aria-hidden="true"></span>
    <span id="fireToggleLabel">收到祝福</span>
  </button>

  <p class="fire-hint" id="fireHint" aria-hidden="true">轻触夜空 · 绽放烟火</p>

  <script>
    (function () {
      'use strict';

      var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var canvas = document.getElementById('fireworks');
      var ctx = canvas && canvas.getContext('2d');

      /* 不支持 Canvas 时优雅降级：保留背景渐变，不报错 */
      if (!canvas || !ctx) return;

      var DPR = Math.min(window.devicePixelRatio || 1, 2);
      var W = 0, H = 0;

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      var isMobile = W < 640;
      var PALETTE = ['#f7e3a8', '#e8c96a', '#ffd9a0', '#ffb38a', '#e8503a', '#fff6e0'];
      function rand(a, b) { return a + Math.random() * (b - a); }

      /* ---- 星空 ---- */
      var stars = [];
      function makeStars() {
        stars = [];
        var n = isMobile ? 90 : 170;
        for (var i = 0; i < n; i++) {
          stars.push({
            x: Math.random() * W,
            y: Math.random() * H * 0.85,
            r: Math.random() * 1.2 + 0.3,
            base: 0.3 + Math.random() * 0.65,
            phase: Math.random() * Math.PI * 2,
            speed: 0.4 + Math.random() * 1.1
          });
        }
      }
      makeStars();

      /* ---- 漂浮金尘（氛围粒子） ---- */
      var dust = [];
      function makeDust() {
        dust = [];
        var n = isMobile ? 18 : 38;
        for (var i = 0; i < n; i++) {
          dust.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: 0.7 + Math.random() * 1.5,
            vx: (Math.random() - 0.5) * 0.18,
            vy: -(0.12 + Math.random() * 0.35),
            a: 0.15 + Math.random() * 0.35,
            tw: Math.random() * Math.PI * 2
          });
        }
      }
      makeDust();

      /* ---- 烟花：火箭 + 火花 ---- */
      var rockets = [];
      var sparks = [];

      function explode(x, y, color) {
        var n = isMobile ? 46 : 80;
        for (var i = 0; i < n; i++) {
          var ang = (i / n) * Math.PI * 2 + rand(-0.04, 0.04);
          var speed = rand(1.1, 4.4);
          sparks.push({
            x: x, y: y,
            vx: Math.cos(ang) * speed,
            vy: Math.sin(ang) * speed,
            life: 1,
            decay: rand(0.008, 0.017),
            r: rand(0.9, 2.1),
            color: color || PALETTE[Math.floor(Math.random() * PALETTE.length)],
            gravity: 0.045,
            drag: 0.985
          });
        }
      }

      /* 爱心形状烟花：粒子沿爱心曲线散布并定格 */
      function explodeHeart(x, y) {
        var w = Math.min(W * 0.42, 280);
        var scale = w / 34;
        var n = isMobile ? 44 : 70;
        for (var i = 0; i < n; i++) {
          var t = (i / n) * Math.PI * 2;
          var hx = 16 * Math.pow(Math.sin(t), 3);
          var hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
          sparks.push({
            kind: 'heart',
            sx: x, sy: y,
            tx: x + hx * scale,
            ty: y - (hy + 2.6) * scale,   /* 屏幕 y 向下，取负才为正立爱心 */
            x: x, y: y,
            p: 0,
            speed: rand(0.018, 0.034),
            life: 1,
            decay: rand(0.0035, 0.006),
            r: rand(1.1, 2.3),
            color: PALETTE[Math.floor(Math.random() * PALETTE.length)]
          });
        }
      }

      function launch(x, startY, targetY, color, vy, shape) {
        rockets.push({
          x: x, y: startY,
          targetY: targetY,
          vx: rand(-0.35, 0.35),
          vy: vy != null ? vy : rand(-6.6, -5.0),
          color: color || PALETTE[Math.floor(Math.random() * PALETTE.length)],
          shape: shape || 'round'
        });
      }

      /* 收到祝福：自动烟花调度（初始关闭） */
      var autoEnabled = false;
      var nextAuto = performance.now() + 1200;
      var heartSwitchAt = 0;   /* 开启后第 5 秒由五彩圆花切换为爱心烟花 */
      var fireMode = 'round';  /* 'round' 五彩圆形 | 'heart' 爱心形状 */

      function autoFire(now) {
        if (!autoEnabled || now < nextAuto) return;
        if (now >= heartSwitchAt) fireMode = 'heart';  /* 开启 5 秒后转为爱心烟花 */
        var shape = fireMode;
        var x = rand(W * 0.12, W * 0.88);
        var startY = H * rand(0.8, 0.94);
        launch(x, startY, H * rand(0.22, 0.5), null, null, shape);
        if (Math.random() < 0.5) {
          launch(rand(W * 0.12, W * 0.88), H * rand(0.8, 0.94), H * rand(0.2, 0.46), null, null, shape);
        }
        nextAuto = now + rand(1100, 2200);
      }

      /* 盛大齐放（点击按钮时触发，五彩圆花） */
      function finale() {
        var n = isMobile ? 8 : 14;
        for (var i = 0; i < n; i++) {
          (function (i) {
            setTimeout(function () {
              launch(
                rand(W * 0.1, W * 0.9),
                H * rand(0.82, 0.95),
                H * rand(0.18, 0.5),
                PALETTE[Math.floor(Math.random() * PALETTE.length)],
                rand(-6.8, -4.8)
              );
            }, i * 110);
          })(i);
        }
      }

      /* ---- 绘制主循环 ---- */
      var last = performance.now();

      function frame(now) {
        var dt = Math.min(now - last, 50) / 16.667;
        last = now;

        autoFire(now);

        ctx.clearRect(0, 0, W, H);

        /* 星空（闪烁） */
        var t = now / 1000;
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          var tw = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
          ctx.globalAlpha = s.base * (0.35 + 0.65 * tw);
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }

        /* 漂浮金尘（缓缓上浮，触底回卷） */
        for (var d = 0; d < dust.length; d++) {
          var p = dust[d];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.y < -4) { p.y = H + 4; p.x = Math.random() * W; }
          if (p.x < -4) p.x = W + 4;
          if (p.x > W + 4) p.x = -4;
          ctx.globalAlpha = p.a * (0.6 + 0.4 * Math.sin(t * 0.8 + p.tw));
          ctx.fillStyle = '#f7e3a8';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }

        /* 火箭上升 */
        for (var r = rockets.length - 1; r >= 0; r--) {
          var rk = rockets[r];
          rk.y += rk.vy * dt;
          rk.vy += 0.025 * dt;        /* 上升减速 */
          rk.x += rk.vx * dt;

          /* 尾迹 */
          ctx.globalAlpha = 0.9;
          ctx.fillStyle = rk.color;
          ctx.beginPath();
          ctx.arc(rk.x, rk.y + 2, 1.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 0.28;
          ctx.beginPath();
          ctx.arc(rk.x, rk.y + 5, 3.2, 0, Math.PI * 2);
          ctx.fill();

          if (rk.y <= rk.targetY) {
            if (rk.shape === 'heart') explodeHeart(rk.x, rk.y);
            else explode(rk.x, rk.y, rk.color);
            rockets.splice(r, 1);
          }
        }

        /* 火花扩散（圆形下落 / 爱心定格） */
        for (var k = sparks.length - 1; k >= 0; k--) {
          var sp = sparks[k];

          if (sp.kind === 'heart') {
            /* 从中心飞向爱心曲线并定格，随后缓缓淡出 */
            sp.p += sp.speed * dt;
            if (sp.p > 1) sp.p = 1;
            var ease = 1 - Math.pow(1 - sp.p, 3);
            sp.x = sp.sx + (sp.tx - sp.sx) * ease;
            sp.y = sp.sy + (sp.ty - sp.sy) * ease;
            sp.life -= sp.decay * dt;
          } else {
            sp.vx *= sp.drag;
            sp.vy = sp.vy * sp.drag + sp.gravity * dt;
            sp.x += sp.vx * dt;
            sp.y += sp.vy * dt;
            sp.life -= sp.decay * dt;
          }

          if (sp.life <= 0) {
            sparks.splice(k, 1);
            continue;
          }
          ctx.globalAlpha = Math.max(sp.life, 0) * 0.9;
          ctx.fillStyle = sp.color;
          ctx.beginPath();
          var rad = sp.kind === 'heart' ? sp.r : sp.r * sp.life + 0.3;
          ctx.arc(sp.x, sp.y, rad, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalAlpha = 1;
        requestAnimationFrame(frame);
      }

      /* 点击任意处绽放烟花（点按钮除外），偶发双朵更热闹 */
      window.addEventListener('pointerdown', function (e) {
        if (e.target && e.target.closest && e.target.closest('#fireToggle')) return;
        explode(e.clientX, e.clientY, null);
        if (Math.random() < 0.55) {
          explode(e.clientX + rand(-40, 40), e.clientY + rand(-30, 20), null);
        }
      });

      /* 收到祝福按钮：开 → 五彩齐放，5 秒后转爱心烟花；再点关闭 */
      var toggle = document.getElementById('fireToggle');
      var toggleLabel = document.getElementById('fireToggleLabel');
      toggle.addEventListener('click', function () {
        autoEnabled = !autoEnabled;
        toggle.setAttribute('aria-pressed', autoEnabled ? 'true' : 'false');
        toggleLabel.textContent = '收到祝福';
        if (autoEnabled) {
          fireMode = 'round';
          heartSwitchAt = performance.now() + 5000;
          finale();
          nextAuto = performance.now() + 1200;
        }
      });

      /* 提示文字稍后淡出 */
      var hint = document.getElementById('fireHint');
      if (hint) setTimeout(function () { hint.classList.add('is-faded'); }, 6000);

      /* 切到后台时暂停动画，省电 */
      var running = true;
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          running = false;
          cancelAnimationFrame(frameId);
        } else if (running === false) {
          running = true;
          last = performance.now();
          requestAnimationFrame(frame);
        }
      });

      var frameId;

      if (REDUCED) {
        /* 减少动态：只绘制一帧静态星空，不跑动画循环 */
        var staticT = performance.now() / 1000;
        ctx.clearRect(0, 0, W, H);
        for (var si = 0; si < stars.length; si++) {
          var st = stars[si];
          ctx.globalAlpha = st.base * 0.8;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        return;
      }

      frameId = requestAnimationFrame(frame);
    })();

    /* ============ 开场：收信人姓名 → 个性化祝福 ============ */
    (function () {
      'use strict';
      var intro = document.getElementById('intro');
      var nameInput = document.getElementById('introName');
      var errEl = document.getElementById('introErr');
      var cta = document.getElementById('introCta');
      if (!intro || !nameInput || !cta) return;

      /* 名字可能含 HTML，先转义再插入，避免 XSS */
      function esc(s) {
        return s.replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      var WISH_TEMPLATES = [
        ['愿{v}清辉所至，皆是团圆', '愿{v}心之所念，皆得圆满'],
        ['{v}，桂子飘香时节', '愿人间至味是团圆，岁岁常欢愉'],
        ['海上生明月 · 天涯共此时', '愿{v}所念之人，皆在身旁'],
        ['花好月圆夜，万家灯火明', '愿{v}所盼皆所期，所求皆如愿']
      ];

      function submit() {
        var name = nameInput.value.replace(/\s+/g, '').trim();
        if (!name) {
          intro.classList.add('is-error');
          errEl.textContent = '请先输入收信人的名字';
          nameInput.focus();
          setTimeout(function () { intro.classList.remove('is-error'); }, 450);
          return;
        }
        name = name.slice(0, 12);
        var safe = esc(name);

        /* 生成个性化祝福并写入主卡片 */
        var t = WISH_TEMPLATES[Math.floor(Math.random() * WISH_TEMPLATES.length)];
        var wish = document.querySelector('.wish');
        if (wish) {
          wish.innerHTML = t[0].replace(/\{v\}/g, safe) + '<br/>' + t[1].replace(/\{v\}/g, safe);
        }
        var eyebrow = document.querySelector('.eyebrow');
        if (eyebrow) eyebrow.textContent = '致 ' + name + ' · 农历八月十五 中秋';

        /* 淡出开场层 */
        intro.classList.add('is-done');
        setTimeout(function () { if (intro.parentNode) intro.parentNode.removeChild(intro); }, 750);
      }

      cta.addEventListener('click', submit);
      nameInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') submit();
      });
      nameInput.focus();
    })();
  </script>
</body>
</html>
